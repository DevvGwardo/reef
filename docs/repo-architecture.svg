<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070f1e"/>
      <stop offset="100%" stop-color="#0d2138"/>
    </linearGradient>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132a4a" stroke-width="0.4" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="800" height="420" rx="12" fill="url(#bg2)"/>
  <rect width="800" height="420" rx="12" fill="url(#grid2)"/>
  <rect width="800" height="420" rx="12" fill="none" stroke="#132a4a" stroke-width="1"/>
  
  <!-- Title -->
  <text x="400" y="36" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#3a5a7a" text-anchor="middle" letter-spacing="3">REEF CAPSULE ARCHITECTURE</text>
  
  <!-- Boxes -->
  <!-- CLI row -->
  <g>
    <rect x="40" y="60" width="220" height="56" rx="10" fill="#0f2a1a" stroke="#00ff88" stroke-width="1.5"/>
    <text x="150" y="82" font-family="'Geist Mono', monospace" font-size="12" font-weight="700" fill="#00ff88" text-anchor="middle">reef CLI</text>
    <text x="150" y="98" font-family="Inter, sans-serif" font-size="9" fill="#4a9a6a" text-anchor="middle">new · dev · deploy · host</text>
  </g>
  <!-- Arrow -->
  <g stroke="#2a4a6a" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a4a6a"/></marker></defs>
  </g>
  <line x1="260" y1="88" x2="310" y2="88" stroke="#2a4a6a" stroke-width="1.2"/>
  <polygon points="310,88 302,83 302,93" fill="#2a4a6a"/>
  
  <!-- Capsule definition -->
  <g>
    <rect x="320" y="60" width="220" height="56" rx="10" fill="#0f1e36" stroke="#3a6a9a" stroke-width="1.2"/>
    <text x="430" y="82" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#6aa0d0" text-anchor="middle">server/index.ts</text>
    <text x="430" y="98" font-family="Inter, sans-serif" font-size="9" fill="#4a6a8a" text-anchor="middle">schema · queries · mutations</text>
  </g>
  <line x1="540" y1="88" x2="590" y2="88" stroke="#2a4a6a" stroke-width="1.2"/>
  <polygon points="590,88 582,83 582,93" fill="#2a4a6a"/>
  
  <!-- Runtime -->
  <g>
    <rect x="600" y="60" width="160" height="56" rx="10" fill="#0f2a1a" stroke="#00ff88" stroke-width="1.2"/>
    <text x="680" y="82" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#00ff88" text-anchor="middle">Hono Runtime</text>
    <text x="680" y="98" font-family="Inter, sans-serif" font-size="9" fill="#4a9a6a" text-anchor="middle">SQLite · esbuild · HMR</text>
  </g>
  
  <!-- Second row - DB and APIs -->
  <rect x="320" y="150" width="220" height="48" rx="10" fill="#132a1a" stroke="#2a5a3a" stroke-width="1"/>
  <text x="430" y="170" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#5aaa7a" text-anchor="middle">SQLite — auto-provisioned</text>
  <text x="430" y="186" font-family="Inter, sans-serif" font-size="8" fill="#3a6a4a" text-anchor="middle">ctx.db · one table per schema entry</text>
  
  <rect x="600" y="150" width="160" height="48" rx="10" fill="#132a1a" stroke="#2a5a3a" stroke-width="1"/>
  <text x="680" y="170" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#5aaa7a" text-anchor="middle">Generated API</text>
  <text x="680" y="186" font-family="Inter, sans-serif" font-size="8" fill="#3a6a4a" text-anchor="middle">/api/query/* · /api/mutation/*</text>
  
  <!-- Client -->
  <rect x="40" y="150" width="220" height="48" rx="10" fill="#1a2340" stroke="#3a4a7a" stroke-width="1"/>
  <text x="150" y="170" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#7aa0d0" text-anchor="middle">Preact Client</text>
  <text x="150" y="186" font-family="Inter, sans-serif" font-size="8" fill="#4a6a8a" text-anchor="middle">useQuery · useMutation · useAuth</text>
  
  <!-- Vertical connectors -->
  <line x1="430" y1="116" x2="430" y2="150" stroke="#1e3a2a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="680" y1="116" x2="680" y2="150" stroke="#1e3a2a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="150" y1="116" x2="150" y2="150" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 3"/>
  
  <!-- Bottom row - Deploy paths -->
  <rect x="40" y="240" width="720" height="70" rx="10" fill="#080e1a" stroke="#1e2a3a" stroke-width="1"/>
  <text x="400" y="260" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#3a5a7a" text-anchor="middle" letter-spacing="2">DEPLOY TARGETS</text>
  
  <rect x="60" y="272" width="200" height="28" rx="7" fill="#0f1a2e" stroke="#2a3a5a" stroke-width="0.8"/>
  <text x="160" y="290" font-family="'Geist Mono', monospace" font-size="9" fill="#6a8aba" text-anchor="middle">reef deploy → reef.app</text>
  
  <rect x="280" y="272" width="200" height="28" rx="7" fill="#0f1a2e" stroke="#2a3a5a" stroke-width="0.8"/>
  <text x="380" y="290" font-family="'Geist Mono', monospace" font-size="9" fill="#6a8aba" text-anchor="middle">reef deploy --local</text>
  
  <rect x="500" y="272" width="200" height="28" rx="7" fill="#0f1a2e" stroke="#2a3a5a" stroke-width="0.8"/>
  <text x="600" y="290" font-family="'Geist Mono', monospace" font-size="9" fill="#6a8aba" text-anchor="middle">reef host (self-host)</text>
  
  <!-- Shopify badge -->
  <g>
    <rect x="300" y="336" width="200" height="32" rx="8" fill="#0a1f0a" stroke="#00ff88" stroke-width="1" opacity="0.9"/>
    <text x="400" y="356" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" fill="#00ff88" text-anchor="middle">✦ ctx.shopify.graphql()</text>
  </g>
  
  <!-- Footer -->
  <text x="400" y="400" font-family="'Geist Mono', monospace" font-size="8" fill="#1e3a4a" text-anchor="middle" letter-spacing="1">ONE FILE · ONE COMMAND · ONE RUNTIME</text>
</svg>